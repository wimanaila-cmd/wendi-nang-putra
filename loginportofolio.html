<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login Portfolio — Wendi Nang Putra</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --danger: #b91c1c;
      --danger-bg: #fee2e2;
      --success: #15803d;
      --success-bg: #dcfce7;
      --radius: 18px;
      --shadow:
        0 20px 50px
        rgba(15, 23, 42, 0.10);
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #f8fafc,
          #eef4ff
        );

      color: var(--text);
    }

    .login-wrapper {
      width: 100%;
      max-width: 430px;
    }

    .brand {
      text-align: center;
      margin-bottom: 22px;
    }

    .brand-logo {
      width: 64px;
      height: 64px;

      margin: 0 auto 14px;

      border-radius: 18px;

      background: var(--primary);
      color: #ffffff;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 23px;
      font-weight: 800;

      box-shadow:
        0 10px 25px
        rgba(37, 99, 235, 0.25);
    }

    .brand h1 {
      font-size: 25px;
      margin-bottom: 6px;
    }

    .brand p {
      color: var(--muted);
      font-size: 14px;
    }

    .card {
      background: var(--card);

      border: 1px solid var(--border);

      border-radius: var(--radius);

      padding: 28px;

      box-shadow: var(--shadow);
    }

    .card-title {
      font-size: 20px;
      font-weight: 750;

      margin-bottom: 6px;
    }

    .card-description {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;

      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;

      font-size: 13px;
      font-weight: 650;

      margin-bottom: 7px;
    }

    input {
      width: 100%;

      border: 1px solid var(--border);

      border-radius: 10px;

      padding: 12px 13px;

      font-size: 14px;

      outline: none;

      background: #ffffff;

      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--primary);

      box-shadow:
        0 0 0 3px
        rgba(37, 99, 235, 0.10);
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 72px;
    }

    .toggle-password {
      position: absolute;

      right: 9px;
      top: 50%;

      transform: translateY(-50%);

      border: 0;
      background: transparent;

      color: var(--muted);

      font-size: 12px;
      font-weight: 650;

      padding: 5px 7px;
    }

    .toggle-password:hover {
      color: var(--text);
    }

    .btn-login {
      width: 100%;

      border: 0;

      border-radius: 10px;

      padding: 13px 15px;

      background: var(--primary);
      color: #ffffff;

      font-size: 14px;
      font-weight: 700;

      margin-top: 5px;

      transition:
        background 0.2s,
        transform 0.1s;
    }

    .btn-login:hover {
      background: var(--primary-dark);
    }

    .btn-login:active {
      transform: scale(0.99);
    }

    .btn-login:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    .alert {
      border-radius: 10px;

      padding: 11px 13px;

      margin-bottom: 17px;

      font-size: 13px;

      line-height: 1.5;

      border: 1px solid transparent;
    }

    .alert.error {
      background: var(--danger-bg);
      color: var(--danger);
      border-color: #fecaca;
    }

    .alert.success {
      background: var(--success-bg);
      color: var(--success);
      border-color: #bbf7d0;
    }

    .hidden {
      display: none !important;
    }

    .footer {
      text-align: center;

      margin-top: 18px;

      color: var(--muted);

      font-size: 12px;
      line-height: 1.5;
    }

    .connection {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 7px;

      margin-top: 12px;
    }

    .connection-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: #9ca3af;
    }

    .connection-dot.online {
      background: #16a34a;
    }

    .connection-dot.error {
      background: #dc2626;
    }

    @media (max-width: 480px) {

      .card {
        padding: 23px;
      }

      .brand h1 {
        font-size: 22px;
      }

    }

  </style>
</head>

<body>

  <div class="login-wrapper">

    <!-- BRAND -->

    <div class="brand">

      <div class="brand-logo">
        W
      </div>

      <h1>
        Wendi Nang Putra
      </h1>

      <p>
        Portfolio Administration
      </p>

    </div>


    <!-- LOGIN CARD -->

    <div class="card">

      <div class="card-title">
        Admin Login
      </div>

      <div class="card-description">
        Masuk untuk mengelola data portfolio,
        pengalaman, pendidikan, skills,
        sertifikat, dan project.
      </div>


      <!-- ALERT -->

      <div
        id="alertBox"
        class="alert hidden"
      ></div>


      <!-- FORM -->

      <form
        id="loginForm"
        autocomplete="on"
      >

        <div class="form-group">

          <label for="username">
            Username
          </label>

          <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            placeholder="Masukkan username"
            required
          >

        </div>


        <div class="form-group">

          <label for="password">
            Password
          </label>

          <div class="password-wrapper">

            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Masukkan password"
              required
            >

            <button
              id="togglePassword"
              class="toggle-password"
              type="button"
            >
              Tampilkan
            </button>

          </div>

        </div>


        <button
          id="loginButton"
          class="btn-login"
          type="submit"
        >
          Masuk
        </button>

      </form>


      <!-- CONNECTION -->

      <div class="connection">

        <span
          id="connectionDot"
          class="connection-dot"
        ></span>

        <span id="connectionText">
          Memeriksa koneksi...
        </span>

      </div>

    </div>


    <!-- FOOTER -->

    <div class="footer">

      WENDI CV Backend<br>

      Portfolio Administration System

    </div>

  </div>


  <script>

    /*
     * ======================================================
     * KONFIGURASI
     * ======================================================
     */

    const API_URL =
      'https://script.google.com/macros/s/AKfycbydJ5EZLCQpdnM_-4Bjb038Yee7jdqSZrZLIqFfsu-QUQRpAAPldCvqA4WnxZ0ureTluA/exec';


    const DASHBOARD_URL =
      'dashboardportofolio.html';


    /*
     * ======================================================
     * ELEMENTS
     * ======================================================
     */

    const loginForm =
      document.getElementById(
        'loginForm'
      );

    const usernameInput =
      document.getElementById(
        'username'
      );

    const passwordInput =
      document.getElementById(
        'password'
      );

    const loginButton =
      document.getElementById(
        'loginButton'
      );

    const alertBox =
      document.getElementById(
        'alertBox'
      );

    const togglePassword =
      document.getElementById(
        'togglePassword'
      );

    const connectionDot =
      document.getElementById(
        'connectionDot'
      );

    const connectionText =
      document.getElementById(
        'connectionText'
      );


    /*
     * ======================================================
     * ALERT
     * ======================================================
     */

    function showAlert(
      message,
      type
    ) {

      alertBox.className =
        'alert ' + type;

      alertBox.textContent =
        message;

    }


    function hideAlert() {

      alertBox.className =
        'alert hidden';

      alertBox.textContent =
        '';

    }


    /*
     * ======================================================
     * CONNECTION STATUS
     * ======================================================
     */

    function setConnectionStatus(
      online,
      text
    ) {

      connectionDot.className =
        'connection-dot ' +
        (
          online
            ? 'online'
            : 'error'
        );

      connectionText.textContent =
        text;

    }


    /*
     * ======================================================
     * CHECK API
     * ======================================================
     */

    async function checkApi() {

      try {

        const response =
          await fetch(
            API_URL +
            '?action=health&_=' +
            Date.now(),
            {
              method: 'GET',
              cache: 'no-store'
            }
          );


        if (!response.ok) {

          throw new Error(
            'HTTP ' +
            response.status
          );

        }


        const result =
          await response.json();


        if (
          !result ||
          result.success !== true
        ) {

          throw new Error(
            'API tidak memberikan respons valid.'
          );

        }


        setConnectionStatus(
          true,
          'API terhubung'
        );


      }
      catch (error) {

        console.error(
          'API health error:',
          error
        );


        setConnectionStatus(
          false,
          'API tidak terhubung'
        );

      }

    }


    /*
     * ======================================================
     * LOGIN API
     * ======================================================
     */

    async function login(
      username,
      password
    ) {

      const response =
        await fetch(
          API_URL,
          {
            method: 'POST',

            headers: {
              'Content-Type':
                'text/plain;charset=utf-8'
            },

            body:
              JSON.stringify({
                action: 'login',
                username: username,
                password: password
              })

          }
        );


      if (!response.ok) {

        throw new Error(
          'HTTP ' +
          response.status
        );

      }


      const result =
        await response.json();


      return result;

    }


    /*
     * ======================================================
     * SUBMIT LOGIN
     * ======================================================
     */

    loginForm.addEventListener(
      'submit',
      async function(event) {

        event.preventDefault();


        hideAlert();


        const username =
          usernameInput.value.trim();


        const password =
          passwordInput.value;


        if (!username) {

          showAlert(
            'Username wajib diisi.',
            'error'
          );

          usernameInput.focus();

          return;

        }


        if (!password) {

          showAlert(
            'Password wajib diisi.',
            'error'
          );

          passwordInput.focus();

          return;

        }


        loginButton.disabled =
          true;

        loginButton.textContent =
          'Memproses...';


        try {

          const result =
            await login(
              username,
              password
            );


          if (
            !result ||
            result.success !== true
          ) {

            throw new Error(
              (
                result &&
                (
                  result.message ||
                  result.error
                )
              ) ||
              'Username atau password salah.'
            );

          }


          /*
           * TOKEN SESSION
           */

          if (
            !result.token
          ) {

            throw new Error(
              'Login berhasil tetapi token session tidak diterima.'
            );

          }


          /*
           * Simpan token.
           */

          localStorage.setItem(
            'WENDI_CV_ADMIN_TOKEN',
            result.token
          );


          localStorage.setItem(
            'WENDI_CV_ADMIN_USERNAME',
            result.username ||
            username
          );


          if (
            result.expires
          ) {

            localStorage.setItem(
              'WENDI_CV_ADMIN_EXPIRES',
              String(
                result.expires
              )
            );

          }


          showAlert(
            'Login berhasil. Membuka dashboard...',
            'success'
          );


          /*
           * Beri waktu singkat
           * agar pesan terlihat.
           */

          setTimeout(
            function() {

              window.location.href =
                DASHBOARD_URL;

            },
            500
          );


        }
        catch (error) {

          console.error(
            'Login error:',
            error
          );


          showAlert(
            error.message ||
            'Login gagal.',
            'error'
          );


          loginButton.disabled =
            false;

          loginButton.textContent =
            'Masuk';

        }

      }
    );


    /*
     * ======================================================
     * TOGGLE PASSWORD
     * ======================================================
     */

    togglePassword.addEventListener(
      'click',
      function() {

        const isPassword =
          passwordInput.type ===
          'password';


        passwordInput.type =
          isPassword
            ? 'text'
            : 'password';


        togglePassword.textContent =
          isPassword
            ? 'Sembunyikan'
            : 'Tampilkan';

      }
    );


    /*
     * ======================================================
     * START
     * ======================================================
     */

    document.addEventListener(
      'DOMContentLoaded',
      function() {

        checkApi();

        usernameInput.focus();

      }
    );

  </script>

</body>
</html>
